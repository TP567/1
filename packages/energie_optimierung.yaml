# Paket: Energieoptimierung (Fußbodenheizung)
#
# ACHTUNG – noch nicht produktiv nutzbar: Die Entity-IDs sind Platzhalter, die
# Hardware ist noch nicht beschafft. Diese Datei hält die geplante Logik fest,
# bis die Einzelraumregelung tatsächlich existiert (siehe docs/PLANUNG.md).
#
# Warum diese Automation anders aussieht als bei Heizkörpern:
# Eine Fußbodenheizung ist träge – der Estrich braucht Stunden, nicht Minuten.
# Eine harte Absenkung, sobald jemand die Wohnung verlässt, spart deshalb kaum
# Energie, sondern kühlt die Masse aus und macht das Wiederaufheizen teuer.
# Zwei Regeln daraus:
#   1. Nur bei LANGER Abwesenheit absenken (hier: ab 6 Stunden).
#   2. Nur SANFT absenken (1–2 K), nicht auf Frostschutzniveau.
# Bei mehrtägiger Abwesenheit (Urlaub) lohnt eine stärkere Absenkung – dafür
# später ein eigener Urlaubsmodus.

input_number:
  zieltemperatur_anwesend:
    name: "Zieltemperatur (anwesend)"
    min: 15
    max: 26
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer
    initial: 21

  zieltemperatur_abwesend:
    name: "Zieltemperatur (lange abwesend)"
    # Bewusst nur ~1,5 K unter Komforttemperatur – mehr ist bei
    # Fußbodenheizung kontraproduktiv.
    min: 17
    max: 22
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer-low
    initial: 19.5

  abwesenheit_schwelle_stunden:
    name: "Absenkung ab Abwesenheit von"
    min: 2
    max: 24
    step: 1
    unit_of_measurement: "h"
    icon: mdi:timer-sand
    initial: 6

automation:
  - alias: "Energie: Sanfte Absenkung bei langer Abwesenheit"
    description: >
      Senkt die Zieltemperatur erst, wenn seit mehreren Stunden niemand zu
      Hause ist. zone.home führt die Anzahl anwesender Personen, "0" heißt
      also: Wohnung leer.
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        below: 1
        for:
          hours: "{{ states('input_number.abwesenheit_schwelle_stunden') | int(6) }}"
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.wohnzimmer
        data:
          temperature: "{{ states('input_number.zieltemperatur_abwesend') | float(19.5) }}"
    mode: single

  - alias: "Energie: Komforttemperatur bei Rückkehr"
    description: >
      Fährt die Wohlfühltemperatur wieder an, sobald die erste Person zu Hause
      ist. Wegen der Trägheit der Fußbodenheizung dauert das Aufheizen; wer das
      Timing verbessern will, triggert später zusätzlich auf das Verlassen der
      Arbeitsstelle statt erst auf das Eintreffen zu Hause.
    trigger:
      - platform: numeric_state
        entity_id: zone.home
        above: 0
    action:
      - service: climate.set_temperature
        target:
          entity_id: climate.wohnzimmer
        data:
          temperature: "{{ states('input_number.zieltemperatur_anwesend') | float(21) }}"
    mode: single
